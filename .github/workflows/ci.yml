name: Validate music app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: spotfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spotfy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:local_test_only@127.0.0.1:5432/spotfy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run media:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:postgres
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Annotate browser test failures
        if: failure()
        run: node scripts/ci-e2e-annotations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
